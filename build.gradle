plugins {
    id 'dev.nx.gradle.project-graph' version '0.1.20' apply false
    id 'org.springframework.boot' version '3.5.9' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'com.diffplug.spotless' version '6.25.0' apply false
}

allprojects {
    group = 'com.evidence'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

def javaSubprojects = subprojects.findAll { it.buildFile.exists() }

configure(javaSubprojects) {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'dev.nx.gradle.project-graph'
    apply plugin: 'com.diffplug.spotless'

    spotless {
        java {
            target 'src/**/*.java'
            googleJavaFormat('1.22.0')
            importOrder()
            removeUnusedImports()
        }
        lineEndings = 'UNIX'
    }

    tasks.named('check').configure {
        dependsOn tasks.named('spotlessCheck')
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs.add('-parameters')
        options.incremental = true
        options.encoding = 'UTF-8'
        options.fork = true
        options.forkOptions.jvmArgs += ['-Xmx512m']
    }

    dependencyManagement {
        imports {
            mavenBom 'org.springframework.boot:spring-boot-dependencies:3.5.9'
        }
    }

    tasks.named('test').configure {
        useJUnitPlatform()
        maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1
    }
}
