name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evidence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d evidence"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/evidence
      EVIDENCE_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/evidence

    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v5

      - run: pnpm prisma:generate
      - run: pnpm prisma:migrate:deploy
      - run: pnpm exec nx sync:check
      - run: pnpm exec nx format:check --base=$NX_BASE --head=$NX_HEAD
      - run: pnpm orchestrator:typecheck
      - run: pnpm orchestrator:test
      - run: pnpm orchestrator:validate
      - run: pnpm api:check

      - run: pnpm exec nx affected -t lint test build typecheck
      - run: pnpm api:contracts
      - name: Verify the packaged Desktop coding boundary
        shell: bash
        run: |
          set -euo pipefail
          pnpm nx run @evidence/server:build
          pnpm nx run @evidence/desktop:package-unpacked
          sandbox=apps/desktop/dist/packages/linux-unpacked/chrome-sandbox
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          node apps/desktop/scripts/package-smoke.mjs
          node apps/desktop/scripts/package-e2e.mjs

      - name: Run contracts against hosted Nest and PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          pnpm nx build @evidence/server
          mkdir -p "$RUNNER_TEMP/evidence-contract-workspaces"
          server_pid=''
          contract_authorization='Bearer evidence-ci-contracts'
          cleanup() {
            if [[ -n "$server_pid" ]]; then kill "$server_pid" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          EVIDENCE_API_AUTHORIZATION="$contract_authorization" \
            EVIDENCE_HOST=127.0.0.1 PORT=3000 \
            node apps/server/dist/main.js > "$RUNNER_TEMP/evidence-server.log" 2>&1 &
          server_pid=$!
          for attempt in $(seq 1 100); do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/evidence-server.log"
              exit 1
            fi
            sleep 0.1
          done
          curl --fail --silent http://127.0.0.1:3000/health >/dev/null
          API_AUTHORIZATION="$contract_authorization" \
            API_BASE_URL=http://127.0.0.1:3000 \
            CONTRACT_WORKSPACE_ROOT="$RUNNER_TEMP/evidence-contract-workspaces" \
            pnpm api:contracts:remote
