name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evidence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d evidence"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/evidence

    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v5

      - run: pnpm exec nx sync:check
      - run: pnpm exec nx format:check --base=$NX_BASE --head=$NX_HEAD
      - run: pnpm api:check

      - run: pnpm exec nx affected -t lint test build typecheck
      - name: Run API contracts against Java Server
        run: pnpm api:contracts
      - name: Verify the packaged Desktop runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          pnpm nx run @evidence/server:build
          pnpm nx run @evidence/desktop:package-unpacked
          sandbox=apps/desktop/dist/packages/linux-unpacked/chrome-sandbox
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          node apps/desktop/scripts/package-smoke.mjs
