name: Publish Desktop

on:
  push:
    tags:
      - 'v*'
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      tagName:
        description: >-
          Release tag to publish, for example v0.1.0 or desktop-v0.1.0
        required: true
        type: string
      releaseName:
        description: 'GitHub Release name'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }} package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Electron Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2 \
            libgbm1 \
            libgtk-3-0 \
            libnss3 \
            libxss1 \
            libxtst6 \
            xvfb

      - run: pnpm install --frozen-lockfile
      - run: pnpm nx sync:check
      - run: pnpm nx run @evidence/desktop:test
      - run: pnpm nx run @evidence/desktop:typecheck
      - run: pnpm nx run @evidence/desktop:lint

      - name: Smoke test unpacked desktop package
        if: runner.os != 'Linux'
        run: pnpm nx run @evidence/desktop:package-smoke

      - name: Smoke test unpacked Linux desktop package
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm nx run @evidence/desktop:package-smoke

      - name: Build desktop installers
        run: pnpm nx run @evidence/desktop:package

      - name: Upload desktop package artifact
        uses: actions/upload-artifact@v4
        with:
          name: evidence-desktop-${{ runner.os }}
          path: |
            apps/desktop/dist/packages/*.dmg
            apps/desktop/dist/packages/*.zip
            apps/desktop/dist/packages/*.exe
            apps/desktop/dist/packages/*.AppImage
            apps/desktop/dist/packages/*.blockmap
            apps/desktop/dist/packages/latest*.yml
          if-no-files-found: error

  publish:
    name: Publish draft GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download desktop package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tagName || github.ref_name }}
          name: >-
            ${{ inputs.releaseName || format('Evidence Desktop {0}',
            inputs.tagName || github.ref_name) }}
          draft: true
          prerelease: ${{ contains(inputs.tagName || github.ref_name, '-') }}
          files: release-assets/**
