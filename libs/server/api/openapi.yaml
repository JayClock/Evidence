openapi: 3.1.0
info:
  title: Evidence API
  description: Contract-first API for Evidence Web and Desktop clients.
  license:
    name: MIT
    identifier: MIT
  version: 0.1.0
servers:
  - url: http://127.0.0.1:3000
    description: Evidence NestJS server
security:
  - evidenceAuthorization: []
paths:
  /api:
    get:
      tags: []
      operationId: get_root
      responses:
        '200':
          description: API root resource
          content:
            application/vnd.evidence.root+json:
              schema:
                $ref: '#/components/schemas/RootResource'
  /health:
    get:
      tags: []
      operationId: get_health
      security: []
      responses:
        '200':
          description: Health resource
          content:
            application/vnd.evidence.health+json:
              schema:
                $ref: '#/components/schemas/HealthResource'
  /api/users/{userId}:
    get:
      tags: []
      operationId: get_user
      parameters:
        - name: userId
          in: path
          description: User id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User resource
          content:
            application/vnd.evidence.user+json:
              schema:
                $ref: '#/components/schemas/UserResource'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/users/{userId}/sidebar:
    get:
      tags: []
      operationId: get_user_sidebar
      parameters:
        - name: userId
          in: path
          description: User id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sidebar resource
          content:
            application/vnd.evidence.sidebar+json:
              schema:
                $ref: '#/components/schemas/SidebarResource'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/users/{userId}/memberships:
    get:
      tags: []
      operationId: list_user_memberships
      parameters:
        - name: userId
          in: path
          description: User id
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: pageSize
          in: query
          description: Page size
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: User membership collection
          content:
            application/vnd.evidence.memberships+json:
              schema:
                $ref: '#/components/schemas/MembershipCollectionResource'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/workspaces:
    post:
      tags: []
      operationId: create_workspace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceInput'
        required: true
      responses:
        '201':
          description: Created workspace
          headers:
            Location:
              description: Canonical workspace URI
              schema:
                type: string
          content:
            application/vnd.evidence.workspace+json:
              schema:
                $ref: '#/components/schemas/WorkspaceResource'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/workspaces/{workspaceId}:
    get:
      tags: []
      operationId: get_workspace
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workspace resource
          content:
            application/vnd.evidence.workspace+json:
              schema:
                $ref: '#/components/schemas/WorkspaceResource'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    put:
      tags: []
      operationId: update_workspace
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceInput'
        required: true
      responses:
        '200':
          description: Updated workspace
          content:
            application/vnd.evidence.workspace+json:
              schema:
                $ref: '#/components/schemas/WorkspaceResource'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    delete:
      tags: []
      operationId: delete_workspace
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Workspace soft-deleted
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/workspaces/{workspaceId}/inbox-items:
    get:
      tags: []
      operationId: list_inbox_items
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, deferred, closed]
        - name: sourceKind
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Workspace Inbox item collection
          content:
            application/vnd.evidence.inbox-items+json:
              schema:
                $ref: '#/components/schemas/InboxItemCollectionResource'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    post:
      tags: []
      operationId: capture_inbox_item
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxSourceInput'
      responses:
        '201':
          description: Captured Inbox item and first immutable revision
          content:
            application/vnd.evidence.inbox-item+json:
              schema:
                $ref: '#/components/schemas/InboxItemResource'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Inbox source already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/workspaces/{workspaceId}/inbox-items/{itemId}:
    get:
      tags: []
      operationId: get_inbox_item
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workspace Inbox item
          content:
            application/vnd.evidence.inbox-item+json:
              schema:
                $ref: '#/components/schemas/InboxItemResource'
        '404':
          description: Inbox item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    patch:
      tags: []
      operationId: change_inbox_item_status
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxItemStatusInput'
      responses:
        '200':
          description: Updated Inbox item
          content:
            application/vnd.evidence.inbox-item+json:
              schema:
                $ref: '#/components/schemas/InboxItemResource'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Inbox item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Inbox item version conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/workspaces/{workspaceId}/inbox-items/{itemId}/revisions:
    get:
      tags: []
      operationId: list_inbox_revisions
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: itemId
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Inbox source revision collection
          content:
            application/vnd.evidence.inbox-revisions+json:
              schema:
                $ref: '#/components/schemas/InboxRevisionCollectionResource'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Inbox item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    post:
      tags: []
      operationId: update_inbox_source
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxSourceUpdateInput'
      responses:
        '200':
          description: Updated source snapshot; unchanged content reuses the latest revision
          content:
            application/vnd.evidence.inbox-revision+json:
              schema:
                $ref: '#/components/schemas/InboxRevisionResource'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Inbox item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Latest Inbox revision changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/workspaces/{workspaceId}/inbox-items/{itemId}/revisions/{revisionId}:
    get:
      tags: []
      operationId: get_inbox_revision
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: itemId
          in: path
          required: true
          schema:
            type: string
        - name: revisionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Immutable Inbox source revision
          content:
            application/vnd.evidence.inbox-revision+json:
              schema:
                $ref: '#/components/schemas/InboxRevisionResource'
        '404':
          description: Inbox revision not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/workspaces/{workspaceId}/story-candidates:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: list_story_candidates
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/StoryCandidateStatus'
      responses:
        '200':
          description: Workspace Story Candidate collection
          content:
            application/vnd.evidence.story-candidates+json:
              schema:
                $ref: '#/components/schemas/StoryCandidateCollectionResource'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: propose_story_candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryCandidateInput'
      responses:
        '201':
          description: Persisted non-authoritative Story Candidate
          headers:
            Location:
              schema:
                type: string
          content:
            application/vnd.evidence.story-candidate+json:
              schema:
                $ref: '#/components/schemas/StoryCandidateResource'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/workspaces/{workspaceId}/story-candidates/{candidateId}:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: candidateId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: get_story_candidate
      responses:
        '200':
          description: Non-authoritative Story Candidate and decision state
          content:
            application/vnd.evidence.story-candidate+json:
              schema:
                $ref: '#/components/schemas/StoryCandidateResource'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/workspaces/{workspaceId}/story-candidates/{candidateId}/confirm:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: candidateId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: confirm_story_candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryCandidateDecisionInput'
      responses:
        '201':
          description: Immutable Story Revision v1 created by explicit human confirmation
          headers:
            Location:
              schema:
                type: string
          content:
            application/vnd.evidence.story-revision+json:
              schema:
                $ref: '#/components/schemas/StoryRevisionResource'
        '200':
          description: Existing Story Revision returned for an idempotent confirmation retry
          headers:
            Location:
              schema:
                type: string
          content:
            application/vnd.evidence.story-revision+json:
              schema:
                $ref: '#/components/schemas/StoryRevisionResource'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/workspaces/{workspaceId}/story-candidates/{candidateId}/reject:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: candidateId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: reject_story_candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryCandidateDecisionInput'
      responses:
        '200':
          description: Story Candidate with recorded rejection decision
          content:
            application/vnd.evidence.story-candidate+json:
              schema:
                $ref: '#/components/schemas/StoryCandidateResource'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/workspaces/{workspaceId}/stories:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: list_stories
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Human-confirmed Story collection
          content:
            application/vnd.evidence.stories+json:
              schema:
                $ref: '#/components/schemas/StoryCollectionResource'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/workspaces/{workspaceId}/stories/{storyId}:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: storyId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: get_story
      responses:
        '200':
          description: Human-confirmed Story identity and latest revision
          content:
            application/vnd.evidence.story+json:
              schema:
                $ref: '#/components/schemas/StoryResource'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/workspaces/{workspaceId}/stories/{storyId}/revisions:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: storyId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: list_story_revisions
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Immutable Story Revision collection
          content:
            application/vnd.evidence.story-revisions+json:
              schema:
                $ref: '#/components/schemas/StoryRevisionCollectionResource'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: create_story_revision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryRevisionInput'
      responses:
        '201':
          description: Subsequent immutable Story Revision created by the current user
          headers:
            Location:
              schema:
                type: string
          content:
            application/vnd.evidence.story-revision+json:
              schema:
                $ref: '#/components/schemas/StoryRevisionResource'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/workspaces/{workspaceId}/stories/{storyId}/revisions/{revisionId}:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: storyId
        in: path
        required: true
        schema:
          type: string
      - name: revisionId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: get_story_revision
      responses:
        '200':
          description: One immutable Story Revision
          content:
            application/vnd.evidence.story-revision+json:
              schema:
                $ref: '#/components/schemas/StoryRevisionResource'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/workspaces/{workspaceId}/stories/{storyId}/coding-runs:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: storyId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: list_coding_runs
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CodingRunStatus'
      responses:
        '200':
          description: Coding Runs locked to one Story
          content:
            application/vnd.evidence.coding-runs+json:
              schema:
                $ref: '#/components/schemas/CodingRunCollectionResource'
        '400':
          $ref: '#/components/responses/ValidationError'
