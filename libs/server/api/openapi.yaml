components:
  schemas:
    AddMemberInput:
      type: object
      required:
        - user
      properties:
        role:
          type:
            - string
            - 'null'
        user:
          $ref: '#/components/schemas/RefModel'
    UpdateMemberInput:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          minLength: 1
    BTreeMap:
      type: object
      additionalProperties:
        type: object
        required:
          - href
        properties:
          href:
            type: string
      propertyNames:
        type: string
    CreateLogicalEntityInput:
      type: object
      required:
        - name
        - type
      properties:
        content:
          type: string
        label:
          type:
            - string
            - 'null'
        name:
          type: string
        subType:
          type:
            - string
            - 'null'
        type:
          $ref: '#/components/schemas/LogicalEntityType'
    CreateLogicalRelationshipInput:
      type: object
      required:
        - source
        - target
      properties:
        label:
          type:
            - string
            - 'null'
        source:
          $ref: '#/components/schemas/RefModel'
        target:
          $ref: '#/components/schemas/RefModel'
    DeletedResult:
      type: object
      required:
        - deleted
      properties:
        deleted:
          type: boolean
    DiagramCollectionEmbedded:
      type: object
      required:
        - diagrams
      properties:
        diagrams:
          type: array
          items:
            $ref: '#/components/schemas/DiagramResource'
    DiagramCollectionResource:
      type: object
      required:
        - _links
        - _templates
        - _embedded
        - page
      properties:
        _embedded:
          $ref: '#/components/schemas/DiagramCollectionEmbedded'
        _links:
          $ref: '#/components/schemas/BTreeMap'
        _templates:
          $ref: '#/components/schemas/BTreeMap'
        page:
          $ref: '#/components/schemas/PageModel'
    DiagramResource:
      type: object
      required:
        - _links
        - _templates
        - id
        - title
        - viewport
        - createdAt
        - updatedAt
      properties:
        _links:
          $ref: '#/components/schemas/BTreeMap'
        _templates:
          $ref: '#/components/schemas/BTreeMap'
        createdAt:
          type: string
        id:
          type: string
        title:
          type: string
        updatedAt:
          type: string
        viewport:
          $ref: '#/components/schemas/Viewport'
    EdgeCollectionEmbedded:
      type: object
      required:
        - edges
      properties:
        edges:
          type: array
          items:
            $ref: '#/components/schemas/EdgeResource'
    EdgeCollectionResource:
      type: object
      required:
        - _links
        - _embedded
      properties:
        _embedded:
          $ref: '#/components/schemas/EdgeCollectionEmbedded'
        _links:
          $ref: '#/components/schemas/BTreeMap'
    EdgeResource:
      type: object
      required:
        - _links
        - id
        - source
        - target
        - style
        - data
        - animated
        - hidden
        - pathOptions
        - createdAt
        - updatedAt
      properties:
        _links:
          $ref: '#/components/schemas/BTreeMap'
        animated:
          type: boolean
        createdAt:
          type: string
        data:
          type: object
          additionalProperties: {}
          propertyNames:
            type: string
        hidden:
          type: boolean
        id:
          type: string
        interactionWidth:
          type:
            - number
            - 'null'
          format: double
        kind:
          type:
            - string
            - 'null'
        logicalRelationship:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/RefModel'
        markerEnd:
          type:
            - object
            - 'null'
          additionalProperties: {}
          propertyNames:
            type: string
        markerStart:
          type:
            - object
            - 'null'
          additionalProperties: {}
          propertyNames:
            type: string
        pathOptions:
          type: object
          additionalProperties: {}
          propertyNames:
            type: string
        source:
          $ref: '#/components/schemas/RefModel'
        sourceHandle:
          type:
            - string
            - 'null'
        style:
          type: object
          additionalProperties: {}
          propertyNames:
            type: string
        target:
          $ref: '#/components/schemas/RefModel'
        targetHandle:
          type:
            - string
            - 'null'
        updatedAt:
          type: string
    ErrorBody:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    HealthResource:
      type: object
      required:
        - _links
        - status
        - service
      properties:
        _links:
          $ref: '#/components/schemas/BTreeMap'
        service:
          type: string
        status:
          type: string
    Link:
      type: object
      required:
        - href
      properties:
        href:
          type: string
    LinkedRefModel:
      type: object
      required:
        - _links
        - id
      properties:
        _links:
          $ref: '#/components/schemas/BTreeMap'
        id:
          type: string
    InboxItemCollectionEmbedded:
      type: object
      required:
        - inboxItems
      properties:
        inboxItems:
          type: array
          items:
            $ref: '#/components/schemas/InboxItemResource'
    InboxItemCollectionResource:
      type: object
      required:
        - _links
        - _embedded
        - page
      properties:
        _embedded:
          $ref: '#/components/schemas/InboxItemCollectionEmbedded'
        _links:
          $ref: '#/components/schemas/BTreeMap'
        page:
          $ref: '#/components/schemas/PageModel'
    InboxItemResource:
      type: object
      required:
        - _links
        - id
        - sourceKind
        - externalKey
        - title
        - status
        - latestRevisionId
        - latestRevisionSha256
        - revisionCount
        - version
        - createdAt
        - updatedAt
      properties:
        _links:
          $ref: '#/components/schemas/BTreeMap'
        id:
          type: string
        sourceKind:
          type: string
        externalKey:
          type: string
        title:
          type: string
        status:
          type: string
          enum:
            - active
            - deferred
            - closed
        latestRevisionId:
          type: string
        latestRevisionSha256:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        revisionCount:
          type: integer
          format: int32
          minimum: 1
        version:
          type: integer
          format: int32
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    InboxItemStatusInput:
      type: object
      required:
        - status
        - expectedVersion
      properties:
        status:
          type: string
          enum:
            - active
            - deferred
            - closed
        expectedVersion:
          type: integer
          format: int32
          minimum: 1
    InboxRevisionCollectionEmbedded:
      type: object
      required:
        - inboxRevisions
      properties:
        inboxRevisions:
          type: array
          items:
            $ref: '#/components/schemas/InboxRevisionResource'
    InboxRevisionCollectionResource:
      type: object
      required:
        - _links
        - _embedded
        - page
      properties:
        _embedded:
          $ref: '#/components/schemas/InboxRevisionCollectionEmbedded'
        _links:
          $ref: '#/components/schemas/BTreeMap'
        page:
          $ref: '#/components/schemas/PageModel'
    InboxRevisionInput:
      type: object
      required:
        - title
        - body
        - contentType
        - expectedLatestRevisionSha256
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 262144
        contentType:
          type: string
          enum:
            - text/plain
            - text/markdown
        uri:
          type:
            - string
            - 'null'
          format: uri
        providerMetadata:
          type: object
          additionalProperties: {}
        sourceUpdatedAt:
          type:
            - string
            - 'null'
          format: date-time
        expectedLatestRevisionSha256:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
    InboxRevisionResource:
      type: object
      required:
        - _links
        - id
        - revisionNumber
        - title
        - body
        - contentType
        - providerMetadata
        - capturedAt
        - contentSha256
      properties:
        _links:
          $ref: '#/components/schemas/BTreeMap'
        id:
          type: string
        revisionNumber:
          type: integer
          format: int32
          minimum: 1
        title:
          type: string
        body:
          type: string
        contentType:
          type: string
          enum:
            - text/plain
            - text/markdown
        uri:
          type:
            - string
            - 'null'
          format: uri
        providerMetadata:
          type: object
          additionalProperties: {}
        sourceUpdatedAt:
          type:
            - string
            - 'null'
          format: date-time
        capturedAt:
          type: string
          format: date-time
        contentSha256:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
    InboxSourceInput:
      type: object
      required:
        - sourceKind
        - externalKey
        - title
        - body
        - contentType
      properties:
        sourceKind:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        externalKey:
          type: string
          minLength: 1
          maxLength: 256
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 262144
        contentType:
          type: string
          enum:
            - text/plain
            - text/markdown
        uri:
          type:
            - string
            - 'null'
          format: uri
        providerMetadata:
          type: object
          additionalProperties: {}
        sourceUpdatedAt:
          type:
            - string
            - 'null'
          format: date-time
