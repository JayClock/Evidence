  /api/users/{userId}:
    get:
      tags: []
      operationId: get_user
      parameters:
        - name: userId
          in: path
          description: User id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User resource
          content:
            application/vnd.evidence.user+json:
              schema:
                $ref: '#/components/schemas/UserResource'
        '400':
          description: Validation error
          content:
            application/json:
