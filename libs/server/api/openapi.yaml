      type: string
      enum: [passed, failed, skipped]
    CodingRunQualityCheck:
      type: object
      required:
        - name
        - status
        - durationMs
        - summary
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        status:
          $ref: '#/components/schemas/CodingRunQualityStatus'
        durationMs:
          type: [integer, 'null']
          format: int32
          minimum: 0
          maximum: 86400000
        summary:
          type: [string, 'null']
          maxLength: 4000
    CodingRunVersionInput:
      type: object
      required:
        - expectedVersion
      properties:
        expectedVersion:
          type: integer
          format: int32
          minimum: 1
    StartCodingRunInput:
      type: object
      required:
        - storyRevisionId
        - baseCommitSha
      properties:
        storyRevisionId:
          type: string
          minLength: 1
        baseCommitSha:
          type: string
          pattern: '^[a-f0-9]{40}([a-f0-9]{24})?$'
    CodingRunReviewInput:
      allOf:
        - $ref: '#/components/schemas/CodingRunVersionInput'
        - type: object
          required:
            - diffSha256
            - changedFileCount
            - qualityChecks
          properties:
            diffSha256:
              type: string
              pattern: '^sha256:[a-f0-9]{64}$'
            changedFileCount:
              type: integer
              format: int32
              minimum: 1
              maximum: 10000
            qualityChecks:
              type: array
              minItems: 1
              maxItems: 100
              contains:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: passed
              not:
                contains:
                  type: object
                  required:
                    - status
                  properties:
                    status:
                      const: failed
              items:
                $ref: '#/components/schemas/CodingRunQualityCheck'
    CodingRunFailureInput:
      allOf:
        - $ref: '#/components/schemas/CodingRunVersionInput'
        - type: object
          required:
            - code
            - summary
          properties:
            code:
              type: string
              pattern: '^[a-z0-9][a-z0-9._-]{0,99}$'
            summary:
              type: string
              minLength: 1
              maxLength: 4000
    CodingRunAcceptanceInput:
      allOf:
        - $ref: '#/components/schemas/CodingRunVersionInput'
        - type: object
          required:
            - diffSha256
            - commitSha
          properties:
            diffSha256:
              type: string
              pattern: '^sha256:[a-f0-9]{64}$'
            commitSha:
              type: string
              pattern: '^[a-f0-9]{40}([a-f0-9]{24})?$'
    CodingRunRejectionInput:
      allOf:
        - $ref: '#/components/schemas/CodingRunVersionInput'
        - type: object
          required:
            - reason
          properties:
            reason:
              type: string
              minLength: 1
              maxLength: 2000
