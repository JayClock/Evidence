openapi: 3.1.0
info:
  title: Evidence API
  description: Contract-first API for Evidence Web and Desktop clients.
  license:
    name: MIT
    identifier: MIT
  version: 0.1.0
servers:
  - url: http://127.0.0.1:3000
    description: Evidence NestJS server
security:
  - evidenceAuthorization: []
paths:
  /api:
    get:
      tags: []
      operationId: get_root
      responses:
        '200':
          description: API root resource
          content:
            application/vnd.evidence.root+json:
              schema:
                $ref: '#/components/schemas/RootResource'
  /health:
    get:
      tags: []
      operationId: get_health
      security: []
      responses:
        '200':
          description: Health resource
          content:
            application/vnd.evidence.health+json:
              schema:
                $ref: '#/components/schemas/HealthResource'
  /api/users/{userId}:
    get:
      tags: []
      operationId: get_user
      parameters:
        - name: userId
          in: path
          description: User id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User resource
          content:
            application/vnd.evidence.user+json:
              schema:
                $ref: '#/components/schemas/UserResource'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/users/{userId}/sidebar:
    get:
      tags: []
      operationId: get_user_sidebar
      parameters:
        - name: userId
          in: path
          description: User id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sidebar resource
          content:
            application/vnd.evidence.sidebar+json:
              schema:
                $ref: '#/components/schemas/SidebarResource'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/users/{userId}/memberships:
    get:
      tags: []
      operationId: list_user_memberships
      parameters:
        - name: userId
          in: path
          description: User id
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: pageSize
          in: query
          description: Page size
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: User membership collection
          content:
            application/vnd.evidence.memberships+json:
              schema:
                $ref: '#/components/schemas/MembershipCollectionResource'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/workspaces:
    post:
      tags: []
      operationId: create_workspace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceInput'
        required: true
      responses:
        '201':
          description: Created workspace
          headers:
            Location:
              description: Canonical workspace URI
              schema:
                type: string
          content:
            application/vnd.evidence.workspace+json:
              schema:
                $ref: '#/components/schemas/WorkspaceResource'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/workspaces/{workspaceId}:
    get:
      tags: []
      operationId: get_workspace
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workspace resource
          content:
            application/vnd.evidence.workspace+json:
              schema:
                $ref: '#/components/schemas/WorkspaceResource'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    put:
      tags: []
      operationId: update_workspace
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceInput'
        required: true
      responses:
        '200':
          description: Updated workspace
          content:
            application/vnd.evidence.workspace+json:
              schema:
                $ref: '#/components/schemas/WorkspaceResource'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    delete:
      tags: []
      operationId: delete_workspace
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Workspace soft-deleted
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/workspaces/{workspaceId}/inbox-items:
    get:
      tags: []
      operationId: list_inbox_items
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, deferred, closed]
        - name: sourceKind
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Workspace Inbox item collection
          content:
            application/vnd.evidence.inbox-items+json:
              schema:
                $ref: '#/components/schemas/InboxItemCollectionResource'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    post:
      tags: []
      operationId: capture_inbox_item
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxSourceInput'
      responses:
        '201':
          description: Captured Inbox item and first immutable revision
          content:
            application/vnd.evidence.inbox-item+json:
              schema:
                $ref: '#/components/schemas/InboxItemResource'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Inbox source already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/workspaces/{workspaceId}/inbox-items/{itemId}:
    get:
      tags: []
      operationId: get_inbox_item
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workspace Inbox item
          content:
            application/vnd.evidence.inbox-item+json:
              schema:
                $ref: '#/components/schemas/InboxItemResource'
        '404':
          description: Inbox item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    patch:
      tags: []
      operationId: change_inbox_item_status
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxItemStatusInput'
      responses:
        '200':
          description: Updated Inbox item
          content:
            application/vnd.evidence.inbox-item+json:
              schema:
                $ref: '#/components/schemas/InboxItemResource'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Inbox item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Inbox item version conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/workspaces/{workspaceId}/inbox-items/{itemId}/revisions:
    get:
      tags: []
      operationId: list_inbox_revisions
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: itemId
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Inbox source revision collection
          content:
            application/vnd.evidence.inbox-revisions+json:
              schema:
                $ref: '#/components/schemas/InboxRevisionCollectionResource'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Inbox item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    post:
      tags: []
      operationId: update_inbox_source
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxSourceUpdateInput'
      responses:
        '200':
          description: Updated source snapshot; unchanged content reuses the latest revision
          content:
            application/vnd.evidence.inbox-revision+json:
              schema:
                $ref: '#/components/schemas/InboxRevisionResource'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Inbox item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Latest Inbox revision changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/workspaces/{workspaceId}/inbox-items/{itemId}/revisions/{revisionId}:
    get:
      tags: []
      operationId: get_inbox_revision
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: itemId
          in: path
          required: true
          schema:
            type: string
        - name: revisionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Immutable Inbox source revision
          content:
            application/vnd.evidence.inbox-revision+json:
              schema:
                $ref: '#/components/schemas/InboxRevisionResource'
        '404':
          description: Inbox revision not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/workspaces/{workspaceId}/inbox-extractions:
    post:
      operationId: create_inbox_extraction
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInboxExtractionInput'
      responses:
        '201':
          description: Frozen human-selected Inbox source set awaiting analysis
          content:
            application/vnd.evidence.inbox-extraction+json:
              schema:
                $ref: '#/components/schemas/InboxExtractionResource'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/workspaces/{workspaceId}/inbox-extractions/{extractionId}:
    get:
      operationId: get_inbox_extraction
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: extractionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Immutable selected source snapshots and extraction state
          content:
            application/vnd.evidence.inbox-extraction+json:
              schema:
                $ref: '#/components/schemas/InboxExtractionResource'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/workspaces/{workspaceId}/inbox-extractions/{extractionId}/candidates:
    post:
      operationId: propose_inbox_story_candidates
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: extractionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposeInboxCandidatesInput'
      responses:
        '201':
          description: One complete non-authoritative Candidate set
          content:
            application/vnd.evidence.inbox-candidate-set+json:
              schema:
                $ref: '#/components/schemas/ProposedInboxCandidateSetResource'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/workspaces/{workspaceId}/story-candidates:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: list_inbox_story_candidates
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InboxCandidateStatus'
      responses:
        '200':
          description: Non-authoritative Inbox Candidate collection
          content:
            application/vnd.evidence.story-candidates+json:
              schema:
                $ref: '#/components/schemas/InboxStoryCandidateCollectionResource'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/workspaces/{workspaceId}/story-candidates/{candidateId}:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: candidateId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: get_inbox_story_candidate
      responses:
        '200':
          description: Immutable Candidate with derived authority status
          content:
            application/vnd.evidence.story-candidate+json:
              schema:
                $ref: '#/components/schemas/InboxStoryCandidateResource'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/workspaces/{workspaceId}/story-candidates/{candidateId}/defer:
    post:
      operationId: defer_inbox_story_candidate
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: candidateId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxCandidateDecisionInput'
      responses:
        '200':
          description: Candidate with an append-only defer decision
          content:
            application/vnd.evidence.story-candidate+json:
              schema:
                $ref: '#/components/schemas/InboxStoryCandidateResource'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/workspaces/{workspaceId}/story-candidates/{candidateId}/reject:
    post:
      operationId: reject_inbox_story_candidate
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: candidateId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxCandidateDecisionInput'
      responses:
        '200':
          description: Candidate with an append-only reject decision
          content:
            application/vnd.evidence.story-candidate+json:
              schema:
                $ref: '#/components/schemas/InboxStoryCandidateResource'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/workspaces/{workspaceId}/story-candidates/{candidateId}/select:
    post:
      operationId: select_inbox_story_candidate
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: candidateId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectInboxCandidateInput'
      responses:
        '201':
          description: Provisioning Iteration with Frozen Intake and no Story
          headers:
            Location:
              schema:
                type: string
          content:
            application/vnd.evidence.iteration+json:
              schema:
                $ref: '#/components/schemas/IterationResource'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/workspaces/{workspaceId}/iterations/{iterationId}:
    get:
      operationId: get_iteration
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: iterationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Candidate-bound delivery Iteration
          content:
            application/vnd.evidence.iteration+json:
              schema:
                $ref: '#/components/schemas/IterationResource'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/workspaces/{workspaceId}/iterations/{iterationId}/intake:
    get:
      operationId: get_iteration_intake
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: iterationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Self-contained immutable Iteration Intake
          content:
            application/vnd.evidence.iteration-intake+json:
              schema:
                $ref: '#/components/schemas/IterationIntakeResource'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/workspaces/{workspaceId}/iterations/{iterationId}/provisioning/complete:
    post:
      operationId: complete_iteration_provisioning
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: iterationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteIterationProvisioningInput'
      responses:
        '200':
          description: Active Iteration bound to its deterministic branch
          content:
            application/vnd.evidence.iteration+json:
              schema:
                $ref: '#/components/schemas/IterationResource'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '500':
          $ref: '#/components/responses/InternalError'
