plugins {
    id 'java-library'
}

dependencies {
    implementation platform("${smartDomainGroup}:smart-domain-bom:${smartDomainVersion}")
    implementation "${smartDomainGroup}:smart-domain-api-hateoas"
    implementation project(':server-java:application')
    implementation project(':server-java:domain')
    implementation 'jakarta.inject:jakarta.inject-api'
    implementation 'jakarta.ws.rs:jakarta.ws.rs-api'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
    implementation 'org.springframework.hateoas:spring-hateoas'
    implementation 'org.springframework.security:spring-security-core'
    implementation 'org.springframework:spring-context'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('processResources').configure {
    from(file('../../server/api/openapi.yaml')) {
        into 'openapi'
        rename { 'evidence-openapi.yaml' }
    }
}
