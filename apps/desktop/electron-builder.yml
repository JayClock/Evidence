appId: works.earendil.evidence
productName: Evidence
asar: true
asarUnpack:
  - dist/agent-runtime.mjs
  - dist/agent-runtime.mjs.map
  - dist/pair-driver-runtime.mjs
  - dist/pair-driver-runtime.mjs.map
  - dist/pair-red-reviewer-runtime.mjs
  - dist/pair-red-reviewer-runtime.mjs.map
  - dist/showcase-reviewer-runtime.mjs
  - dist/showcase-reviewer-runtime.mjs.map
  - dist/respond-learner-runtime.mjs
  - dist/respond-learner-runtime.mjs.map
  - dist/inbox-analyst-runtime.mjs
  - dist/inbox-analyst-runtime.mjs.map
  - dist/kickoff-analyst-runtime.mjs
  - dist/kickoff-analyst-runtime.mjs.map
  - dist/understanding-analyst-runtime.mjs
  - dist/understanding-analyst-runtime.mjs.map
  - dist/tasking-analyst-runtime.mjs
  - dist/tasking-analyst-runtime.mjs.map
  - node_modules/**/*
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  output: dist/packages

files:
  - dist/main.js
  - dist/main.js.map
  - dist/preload.js
  - dist/preload.js.map
  - dist/agent-runtime.mjs
  - dist/agent-runtime.mjs.map
  - dist/pair-driver-runtime.mjs
  - dist/pair-driver-runtime.mjs.map
  - dist/pair-red-reviewer-runtime.mjs
  - dist/pair-red-reviewer-runtime.mjs.map
  - dist/showcase-reviewer-runtime.mjs
  - dist/showcase-reviewer-runtime.mjs.map
  - dist/respond-learner-runtime.mjs
  - dist/respond-learner-runtime.mjs.map
  - dist/inbox-analyst-runtime.mjs
  - dist/inbox-analyst-runtime.mjs.map
  - dist/kickoff-analyst-runtime.mjs
  - dist/kickoff-analyst-runtime.mjs.map
  - dist/understanding-analyst-runtime.mjs
  - dist/understanding-analyst-runtime.mjs.map
  - dist/tasking-analyst-runtime.mjs
  - dist/tasking-analyst-runtime.mjs.map
  - package.json

extraResources:
  - from: ../web/dist
    to: web
    filter:
      - '**/*'

mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip

win:
  target:
    - nsis

linux:
  category: Development
  executableName: evidence
  target:
    - AppImage
