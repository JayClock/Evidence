# Copy/include this template from your repository. Keep all gates strict on MRs/releases.
# Assumes this pnpm workspace, with the two paths below customized for your project.
stages: [contract, acceptance]

variables:
  GIT_DEPTH: '0'
  WORKSPACE: examples/b2b-escrow
  BOOTSTRAP: examples/b2b-escrow/baseline-v1
  NX_DAEMON: 'false'

.evidence-job:
  image: node:22-bookworm
  before_script:
    - npm install --global pnpm@12.16.1
    # The workspace lockfile also provisions Bruno; no global bru is needed.
    - pnpm install --frozen-lockfile
    - pnpm --filter @evidence-poc/evidence-acceptance exec bru --version
    - pnpm nx build cli

contract-and-hygiene:
  extends: .evidence-job
  stage: contract
  script:
    - pnpm api:setup
    - pnpm evidence check --workspace "$WORKSPACE"
    - pnpm evidence export --workspace "$WORKSPACE" --verify
    - |
      set -euo pipefail
      BASE_SHA="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-${CI_COMMIT_BEFORE_SHA:-}}"
      mkdir -p reports/baseline/.evidence
      SOURCE="$BOOTSTRAP/.evidence/model"
      if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
        git cat-file -e "${BASE_SHA}^{commit}"
        if git cat-file -e "${BASE_SHA}:${WORKSPACE}/.evidence/model/model.json" 2>/dev/null; then
          SOURCE="$WORKSPACE/.evidence/model"
          git archive "$BASE_SHA" "$SOURCE" | tar -x -C reports/baseline/.evidence --strip-components=3
        elif git cat-file -e "${BASE_SHA}:${SOURCE}/model.json" 2>/dev/null; then
          git archive "$BASE_SHA" "$SOURCE" | tar -x -C reports/baseline/.evidence --strip-components=4
        else
          # Explicit bootstrap for the first workspace-format commit.
          cp -R "$SOURCE" reports/baseline/.evidence/model
        fi
      else
        cp -R "$SOURCE" reports/baseline/.evidence/model
      fi
      pnpm evidence diff reports/baseline "$WORKSPACE" --format markdown > reports/api-diff.md
  artifacts:
    when: always
    paths: [reports/]

.evidence-gate:
  extends: .evidence-job
  stage: acceptance
  needs:
    - job: contract-and-hygiene
      artifacts: true
  script:
    - |
      set -eu
      make -C examples/b2b-escrow prepare IMPLEMENTATION=ts-fastify
      make -C examples/b2b-escrow gate IMPLEMENTATION=ts-fastify GATE="$GATE" \
        BASELINE="$CI_PROJECT_DIR/reports/baseline" \
        REPORT_DIR="$CI_PROJECT_DIR/reports/$GATE"
  artifacts:
    when: always
    paths: [reports/]
    reports:
      junit: reports/*/ts-fastify/*/*.xml

regression-gate:
  extends: .evidence-gate
  variables:
    GATE: regression

dod-gate:
  extends: .evidence-gate
  variables:
    GATE: dod
